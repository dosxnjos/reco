repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks: [{id: ruff-check}]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks: [{id: gitleaks}]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml

  # Teto de tamanho do CLAUDE.md (12/09/2026, overhaul do harness, eixo H.6 —
  # roadmap/2026-09-01-harness-claude-md-hooks-skills-armadilhas.md, Fase 6):
  # CLAUDE.md é mapa, não depósito — regra em 1–3 linhas + link, e o porquê mora
  # em docs/ ou no cérebro. O gate da raiz só enxerga o CLAUDE.md da raiz, então
  # cada repo cobra o seu chamando o mesmo script (dono único da lógica; o teto
  # vive aqui). Estourou → mova texto para docs/; subir o teto é decisão
  # registrada na "Cronologia dos tetos" de
  # cerebro/temas/harness/claude-md-e-documentacao.md, nunca ajuste silencioso.
  # ⚠️ Caminho ABSOLUTO de propósito: com `../cerebro/...` o hook morre dentro de
  # um worktree (`.claude/worktrees/<id>` sobe para `<repo>/.claude/`), e a regra
  # da casa manda usar worktree justamente em repo com gate. Em clone fora de
  # C:/Dev o script não existe: remova este bloco (nenhum CI depende dele).
  - repo: local
    hooks:
      - id: gate-claude-md
        name: teto de tamanho do CLAUDE.md (6 KB)
        entry: python C:/Dev/cerebro/scripts/gate_claude_md.py --arquivo CLAUDE.md --teto 6144
        language: system
        files: '^CLAUDE\.md$'
        pass_filenames: false
      # Trava de tamanho e de complexidade (11/10/2026, Fase 6 de
      # C:/Dev/roadmap/2026-10-11-melhoria-trava-tamanho-e-complexidade.md): arquivo
      # de código novo até 500 linhas, o grande não cresce, função complexa nova
      # avisa. Só AVISA até 26/10 (`aviso_ate` em tools/tamanho.json); o framework
      # esconde a saída de hook que passa, então `verbose: true` é o que mostra o
      # aviso no commit. Mesmo caminho absoluto e a mesma ressalva do bloco acima.
      - id: trava-tamanho
        name: trava de tamanho (arquivo novo até 500 linhas; o grande não cresce)
        entry: python C:/Dev/cerebro/scripts/gate_tamanho.py --config tools/tamanho.json
        language: system
        files: '\.(py|js|mjs|cjs|ps1|sh|cmd|bat)$|^tools/tamanho\.json$'
        pass_filenames: false
        verbose: true
      - id: trava-complexidade
        name: trava de complexidade (C901/PLR0912/PLR0915 do commit não cresce)
        entry: python C:/Dev/cerebro/scripts/gate_complexidade.py --config tools/tamanho.json
        language: system
        files: '\.py$|^tools/tamanho\.json$'
        pass_filenames: false
        verbose: true

  # Visões geradas de fragmentos (12/10/2026, Fase R4 de
  # C:/Dev/roadmap/2026-10-01-paralelismo-e-blindagem.md): docs/ARMADILHAS.md e
  # roadmap/README.md saíram do git e se recompilam pelos hooks de
  # `python tools/visoes.py instalar-hooks` (formato: C:/Dev/cerebro/scripts/visoes_projeto.py).
  # - visoes-fragmento: nome <AAAA-MM-DD>-<slug>.md, frontmatter fechado, titulo:, data: válida.
  # - gate-md-de-card-em-curso (gate D1 da central): recusa commit que toque roadmap/*.md de
  #   card em curso no maestro rodando em OUTRO tree; o executor do próprio card (jaula
  #   sem-manifesto, aqui) passa. Erro de leitura do estado nunca bloqueia.
  # Mesmo caminho absoluto e a mesma ressalva do gate-claude-md acima.
  - repo: local
    hooks:
      - id: visoes-fragmento
        name: fragmento de ARMADILHAS bem formado
        entry: python tools/visoes.py validar
        language: system
        files: '^docs/armadilhas\.d/[^/]+\.md$'
      - id: gate-md-de-card-em-curso
        name: roadmap de card em curso (gate D1 da central)
        entry: python C:/Dev/central/tools/gate_md_de_card_em_curso.py
        language: system
        files: '^roadmap/[^/]+\.md$'
        pass_filenames: false
